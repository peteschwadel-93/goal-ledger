<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Goal Ledger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%9A%A8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column of soft dark cards under pill tabs, the same frame as the Tip-Off Ledger. Single dark theme by design: cold rink-at-night charcoal, ice blue for headings, numbers and controls, green reserved for goals scored and picks that hit. */
:root{
  --bg:#0e1216; --surface:#151b21; --raise:#1c242c; --sunk:#232d37; --ink:#e4ebf1; --soft:#bcc8d3; --muted:#8494a3; --line:#25303a;
  --accent:#6cc4f5; --accent-soft:#132a3a; --accent-ink:#08131b; --made:#63d2b4; --made-soft:#17352e; --miss:#c98d84; --miss-soft:transparent;
  --lv1:#f0a94a; --lv2:#e2d24e; --lv3:#9fdc58; --lv4:#3ef07f; --neg:#e8705f;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1760px;margin:0 auto;padding-inline:24px;padding-block:28px 64px;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.topr{display:flex;align-items:center;gap:22px}
.be{font-size:11.5px;color:var(--muted)}
tbody tr.near>td,tbody tr.near:nth-child(odd)>td{background:rgba(108,196,245,.11)}tbody tr.near>td:first-child{box-shadow:inset 3px 0 0 var(--accent)}.cf{font-weight:600;color:var(--muted)}.cf1{color:var(--lv1)}.cf2{color:var(--lv2)}.cf3{color:var(--lv3)}.cf4{color:var(--lv4)}
.tml{display:inline-flex;align-items:center;gap:.35em;white-space:nowrap;vertical-align:middle}
.tlogo{width:1.5em;height:1.5em;flex:none;object-fit:contain;filter:drop-shadow(0 0 1px rgba(255,255,255,.9)) drop-shadow(0 0 1px rgba(255,255,255,.55))}
td .tlogo{width:22px;height:22px}.lteam h3 .tlogo{width:22px;height:22px}
.at{color:var(--muted);font-weight:400}
.kv.f3{margin-top:-6px}.kv.f3 .o{font-size:12px}
td.rate,th.rate{background:rgba(255,255,255,.035);white-space:nowrap}
td.rate b{font-weight:600}td.rate .chev{vertical-align:-3px;margin-right:6px}
td.rlv1 b{color:var(--lv1)}td.rlv2 b{color:var(--lv2)}td.rlv3 b{color:var(--lv3)}td.rlv4 b{color:var(--lv4)}td.rlv0 b{color:var(--muted);font-weight:500}td.rlvx b{color:var(--muted)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:16px}
.lcard{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lcard.lock{border-color:var(--made);background:linear-gradient(180deg,var(--made-soft),var(--bg) 42%);box-shadow:0 0 0 1px var(--made),0 0 38px -12px var(--made)}
.lhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.lhead .tm{font:600 22px/1 var(--display);letter-spacing:.04em;color:var(--accent);text-transform:uppercase}
.lteams{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.lteam{display:flex;flex-direction:column;gap:8px;min-width:0}
.lteam h3{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--soft)}
.lteam ol{list-style:none;margin:0;padding:0}
.lteam li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:8px 10px;border-radius:8px;font-size:14.5px}
.lteam li:nth-child(odd){background:linear-gradient(90deg,rgba(108,196,245,.17),rgba(108,196,245,.04) 75%,transparent)}
.lteam li:nth-child(even){background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.015) 75%,transparent)}
.lcard.lock .lteam li:nth-child(odd){background:linear-gradient(90deg,rgba(99,210,180,.2),rgba(99,210,180,.04) 75%,transparent)}
.lpos{font:500 11.5px/1 var(--mono);color:var(--muted);width:24px;flex:none;letter-spacing:.02em}
.lteam li .o{margin-left:auto}
.lrep{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--soft)}
.lrep div{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.lrep small{flex-basis:100%;color:var(--muted);font-size:12px;line-height:1.45}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--made);box-shadow:0 0 10px 2px var(--made);display:inline-block;margin-right:6px;vertical-align:1px;animation:lpulse 1.8s ease-in-out infinite}
@keyframes lpulse{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.ldot{animation:none}}
@media(max-width:560px){.lteams{grid-template-columns:1fr}}

@media(min-width:601px){header.top{flex-wrap:nowrap;align-items:center}.topr{flex:none;margin-left:auto}.topr .refresh{max-width:440px}}
.logo{width:72px;height:72px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(108,196,245,.35),0 0 26px 6px rgba(108,196,245,.55),0 0 70px 18px rgba(108,196,245,.22)}
@media(max-width:600px){.logo{width:52px;height:52px}.topr{gap:14px;width:100%;justify-content:space-between}}
h1{font:700 46px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:8px 0 0;letter-spacing:.02em}
.fresh{font:400 12px/1.5 var(--mono);color:var(--muted);text-align:right}
.refresh{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.refresh button{font:600 13px var(--body);color:var(--accent-ink);background:var(--accent);border:0;border-radius:999px;padding:9px 18px;cursor:pointer}
.refresh button:hover{filter:brightness(1.08)}
.refresh button:disabled{opacity:.6;cursor:progress}
#refreshMsg{max-width:90ch}
h2{font:600 26px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0;text-wrap:balance;color:var(--accent)}
h3{font:500 11.5px/1.2 var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:10px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:600 16px var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--soft);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 18px;cursor:pointer}
.tabs button:hover{background:var(--raise)}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);padding:3px;gap:2px}
.seg button{font:500 13px var(--body);color:var(--muted);background:none;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-left:auto}
label.f{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
select,input[type=search]{font:500 14px var(--body);color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:100%}
button:focus-visible,select:focus-visible,input:focus-visible,tr[tabindex]:focus-visible,th[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.phead{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.note{color:var(--muted);font-size:13.5px;margin:0;line-height:1.6}
.note b{color:var(--soft);font-weight:500}
.tw{overflow-x:auto;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:11px 16px;text-align:left;white-space:nowrap}
th{font:500 11px/1.2 var(--body);text-transform:uppercase;letter-spacing:.11em;color:var(--muted);vertical-align:bottom;border-bottom:1px solid var(--line);padding-block:12px}
tbody tr+tr td{border-top:1px solid var(--line)}
tbody tr:nth-child(odd) td{background:color-mix(in srgb,var(--surface) 55%,transparent)}
th[tabindex]{cursor:pointer}
th[tabindex]:hover{color:var(--ink)}
th[aria-sort]{color:var(--accent)}
th[aria-sort]:after{content:" ▾"}
th[aria-sort="ascending"]:after{content:" ▴"}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.n{color:var(--soft)}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--raise)}
tbody tr.on td{background:var(--accent-soft)}
.tm{font:600 16px var(--display);letter-spacing:.07em}
.meter{display:inline-block;width:64px;height:6px;background:var(--sunk);border-radius:999px;vertical-align:middle;margin-left:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
/* matchup */
.pickers{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pickers .vs{font:600 18px var(--display);color:var(--muted);letter-spacing:.08em}
.circle{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px 24px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:20px 24px}
.side{display:flex;flex-direction:column;gap:6px;min-width:0;align-items:flex-start}
.side select{max-width:100%}
.side h3{margin:0}
.side.r{text-align:right;align-items:flex-end}
.big{font:700 48px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.who{font:600 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;overflow-wrap:anywhere}
.mid{width:144px;height:144px;border:1px solid var(--line);background:var(--surface);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}
.midw{display:flex;flex-direction:column;align-items:center;gap:8px}
.hh{font-size:12px;color:var(--muted);letter-spacing:.04em}.harr{font-size:8px;letter-spacing:-1px;vertical-align:1px}.hh b{color:var(--ink);font-weight:500}
.chev{width:86px;height:28px;display:block;flex:none;--c:var(--muted)}
.chev.sm{width:58px;height:19px}
td .chev{display:inline-block;vertical-align:middle}
.chev.lv1{--c:var(--lv1)}.chev.lv2{--c:var(--lv2)}.chev.lv3{--c:var(--lv3)}.chev.lv4{--c:var(--lv4)}
.chev polyline{fill:none;stroke:var(--sunk);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.chev polyline.on{stroke:var(--c);filter:drop-shadow(0 0 4px var(--c))}
.chev.off polyline.on,.mid.off .chev polyline.on{stroke:var(--muted);filter:none}
.rl .rname{min-width:0}
.mid b{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.mid span{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.kv{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:13.5px;color:var(--muted);align-items:baseline}
.kv b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.side.r .kv{justify-content:flex-end}
/* play-by-play shot lines */
.seq{display:flex;flex-direction:column;gap:7px;font-size:13.5px;line-height:1.4}
.shot{display:grid;grid-template-columns:1.2em 3.2em minmax(0,1fr) auto;gap:10px;align-items:baseline}
.shot .o,.shot>span:nth-child(2){color:var(--muted);font-variant-numeric:tabular-nums}
.shot .p{overflow-wrap:anywhere;min-width:0}
.shot .p em{font-style:normal;color:var(--muted)}
.res{display:inline-block;font:600 10.5px/1 var(--body);letter-spacing:.07em;padding:4px 9px;border-radius:999px;vertical-align:middle;border:1px solid transparent}
.res.m{color:var(--accent-ink);background:var(--made)} .res.x{color:var(--muted);border-color:var(--line)}
.gamecard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.gamecard .gh{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:center;font-size:13px;color:var(--soft)}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:12px}
.tag{display:inline-block;font:600 10.5px/1 var(--body);letter-spacing:.07em;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.tag.w{background:var(--made-soft);border-color:transparent;color:var(--made)} .tag.l{color:var(--miss)}
.mix{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 14px;align-items:center;font-size:13.5px;max-width:600px;color:var(--soft)}
.mix .track{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.mix .track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.mix .v{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
td.cell{white-space:nowrap;font-size:13.5px;line-height:1.9;vertical-align:top}
td.cell .o,td.n .o,td .o{color:var(--muted)}
table[style] th,table[style] td{padding-right:32px}
.tw:has(>table[style]){align-self:flex-start;max-width:100%}
.edge{display:inline-block;font:600 12.5px/1 var(--body);letter-spacing:.04em;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
section[id^="pick-"],section[id^="game-"]{scroll-margin-top:16px}
h2.sep{margin-top:12px;color:var(--muted)}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.rcard{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;cursor:pointer;min-width:0}
.rcard:hover{border-color:var(--accent)}
.rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rhead{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.rhead .tm{font-size:22px;color:var(--accent)}
.rblock{display:flex;flex-direction:column;gap:6px}
.rblock h3{margin:0}
.rname{font:600 20px/1.15 var(--display);text-transform:uppercase;letter-spacing:.04em}
.rcard ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:s}
.rcard li{counter-increment:s;display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.rcard li+li{border-top:1px solid var(--line);padding-top:12px}
.rl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rl.pk{flex-direction:column;align-items:stretch;gap:4px}.rl.pk>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding-left:1.5em;font-size:13px}
.rq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted);padding-left:1.5em}
.rq .tag{min-width:38px;text-align:center}
.rcard li .rl>span:first-child:before{content:counter(s);color:var(--accent);font-weight:600;display:inline-block;width:1.5em}
.rcard .o{color:var(--muted);font-size:13px;white-space:nowrap}
.rcard.win{border-color:var(--made);background:linear-gradient(180deg,var(--made-soft),var(--bg) 55%);box-shadow:0 0 0 1px var(--made),0 10px 30px -18px var(--made)}
.rcard.win .rhead .tm{color:var(--made)}
.rcard.win .edge{background:var(--made);color:var(--accent-ink)}
.rcard.win .edge:after{content:" · WIN"}
.rres .hit>span:last-child,.rcard li.hit .rl>span:first-child{color:var(--made);font-weight:600}
.rcard li.hit .rl>span:first-child:before{color:var(--made)}
.tag.q{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.rf{display:flex;flex-wrap:wrap;gap:6px;padding-left:1.5em;align-items:center}
.rf .o{font-size:12px;color:var(--muted)}
.side.r .rf{justify-content:flex-end}.side .rf{padding-left:0}
.rcard.warn .edge{opacity:.5}
.inj{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13.5px;color:var(--soft)}
.px{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.px.v4{color:var(--lv4)}.px.v3{color:var(--lv3)}.px.v2{color:var(--lv1)}.px.v1{color:var(--neg)}
.rval{border-top:1px solid var(--line);padding-top:12px}
.rval .rq{padding-left:0}.rval .rq>span:nth-child(even){text-align:right;color:var(--ink)}
.rval.hit .rl>span:first-child{color:var(--made);font-weight:600}
.rres{border-top:1px solid var(--line);padding-top:12px;font-size:13.5px}
.rres>div{display:flex;justify-content:space-between;gap:10px;align-items:center}
.picks{display:flex;flex-direction:column;gap:20px}
.more{align-self:flex-start;font:500 13px var(--body);color:var(--soft);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.more:hover{color:var(--accent);border-color:var(--accent)}
.more:disabled{opacity:.4;cursor:default;color:var(--muted);border-color:var(--line)}
.empty{color:var(--muted);padding:28px 0;text-align:center}
@media (max-width:1300px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .wrap{padding-inline:16px}.panel{padding:16px}
  h1{font-size:36px}.grid2{grid-template-columns:minmax(0,1fr)}.filters{margin-left:0}.fresh{text-align:left}.refresh{align-items:flex-start}
  .circle{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:16px}.midw{grid-column:1/-1;grid-row:1;justify-self:center}.mid{width:124px;height:124px}
  .big{font-size:38px} th,td{padding:10px 12px}
}
@media (prefers-reduced-motion:no-preference){.tabs button,.seg button,.more,.refresh button{transition:background .15s,color .15s,border-color .15s}}
[hidden]{display:none!important}

/* additions for the Goal Ledger */
.px.c1{color:var(--lv1)}.px.c2{color:var(--lv2)}.px.c3{color:var(--lv3)}.px.c4{color:var(--lv4)}
li.pick,span.pick{cursor:pointer}li.pick:hover{outline:1px solid var(--accent)}span.pick:hover{color:var(--accent)}
li.pick:focus-visible,.rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pxin{width:74px;font:500 13.5px var(--mono);color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:5px 8px;text-align:right}
.pxin::placeholder{color:var(--muted);opacity:.6}
.gksel{font-size:13px;padding:4px 8px;border-radius:8px;max-width:100%}
.calbar{position:relative;width:min(280px,40vw);height:16px}
.calbar i,.calbar b{position:absolute;left:0;display:block;border-radius:999px}
.calbar i{top:1px;height:5px;background:var(--muted)}.calbar b{top:9px;height:6px;background:var(--made)}
.lteam h3 .o{text-transform:none;letter-spacing:.02em}
.rcard .rq{padding-left:0}.rcard .rq>span:nth-child(even){text-align:right;color:var(--ink)}
.rcard .rf{padding-left:0}
.panel>.bar{gap:12px 22px}
.tabs button .o{color:var(--muted);font-weight:500}

/* corner mark */
svg.logo{color:var(--ink);background:var(--bg)}
/* never more than two game cards in a row */
.lgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1100px){.lgrid{grid-template-columns:minmax(0,1fr)}}
/* logos sit beside text without lifting it off the line */
.tml{display:inline;white-space:nowrap;vertical-align:baseline}
.tlogo{display:inline-block;vertical-align:middle;margin-right:.3em;position:relative;top:-.08em}
.lhead .tm,.rhead .tm{display:inline-flex;align-items:baseline;gap:.35em;flex-wrap:wrap}
.lhead,.rhead{align-items:center}
.lteam h3{align-items:baseline}
.lteam .kv{align-items:center}.lteam .kv>span{min-width:0;max-width:100%}
.gksel{display:block;width:100%;margin-top:4px}

function lastN(a){return S.n?a.slice(-S.n):a}
function playerAgg(){ // per-player totals over the filtered games, honouring the Window switch per player
  var by={};G.forEach(function(g){[g.h,g.a].forEach(function(t){g.p[t].forEach(function(r){(by[r[0]]=by[r[0]]||[]).push({g:g,t:t,r:r})})})});
  return Object.keys(by).map(function(p){var l=lastN(by[p]),x={p:+p,name:pname(p),pos:ppos(p),team:l[l.length-1].t,gp:l.length,g:0,sog:0,fen:0,xg:0,toi:0,pp:0,ppg:0,eng:0,a1:0,hd:0,sc:0,pred:0};
    l.forEach(function(e){var r=e.r;x.g+=r[1];x.sog+=r[2];x.fen+=r[3];x.xg+=(r[4]+r[5])/1000;x.toi+=r[6];x.pp+=r[7];x.ppg+=r[8];x.eng+=r[9];x.a1+=r[10];x.hd+=r[11];if(r[1])x.sc++;var pr=IX.PRE[e.g.id][p];x.pred+=1-Math.exp(-pr[0])});

function teamAgg(){
  var by={};G.forEach(function(g){[g.h,g.a].forEach(function(t){(by[t]=by[t]||[]).push(g)})});
  return Object.keys(by).sort().map(function(t){var l=lastN(by[t]),x={t:t,gp:l.length,gf:0,ga:0,xgf:0,xga:0,sf:0,sa:0,ppf:0,ppa:0,ppg:0,ppga:0,enf:0,ena:0};
    l.forEach(function(g){var a=g.t[t],b=g.t[opp(g,t)];x.gf+=a[0];x.ga+=b[0];x.xgf+=a[3]/100;x.xga+=b[3]/100;x.sf+=a[1];x.sa+=b[1];x.ppf+=a[4];x.ppa+=b[4];x.ppg+=a[6];x.ppga+=b[6];x.enf+=a[7];x.ena+=b[7]});return x})}
function goalieAgg(){
  var by={};G.forEach(function(g){[g.h,g.a].forEach(function(t){g.g[t].forEach(function(k){(by[k[0]]=by[k[0]]||[]).push({g:g,t:t,k:k})})})});
  return Object.keys(by).map(function(p){var l=lastN(by[p]),x={p:+p,name:pname(p),team:l[l.length-1].t,gp:l.length,st:0,sa:0,ga:0,xga:0};
    l.forEach(function(e){x.st+=e.k[4];x.sa+=e.k[1];x.ga+=e.k[2];x.xga+=e.k[3]/100});return x})}

  var t5={n:0,h:0,p:0};dayRows.forEach(function(d){t5.n+=d.top.length;t5.h+=d.h;t5.p+=d.exp});

    B.map(function(b,i){return '<tr><td>'+Math.round(bands[i][0]*100)+(bands[i][1]<1?"–"+Math.round(bands[i][1]*100)+"%":"%+")+'</td><td class="n">'+b.n+'</td><td class="n">'+(b.n?p1(b.p/b.n):"–")+'</td><td class="n"><b>'+(b.n?p1(b.h/b.n):"–")+'</b></td><td>'+(b.n?'<div class="calbar"><i style="width:'+(100*b.p/b.n/mx)+'%"></i><b style="width:'+(100*b.h/b.n/mx)+'%"></b></div>':"")+'</td></tr>'}).join("")+'</tbody></table></div>';
  function rec(l,x){return '<span>'+l+' <b>'+x.h+" of "+x.n+'</b> · '+pct(x.h,x.n)+' <span class="o">(model expected '+pct(x.p,x.n)+')</span></span>'}
  function band(title,key,cuts,fmt){var R=cuts.map(function(c){return{c:c,n:0,h:0,ret:0,p:0,be:0}});
    BT.forEach(function(x){for(var i=0;i<R.length;i++)if(x[key]>=R[i].c[0]&&x[key]<R[i].c[1]){var r=R[i];r.n++;r.h+=x.hit;r.ret+=x.hit*x.pay-1;r.p+=x.pr;r.be+=1/x.pay;break}});
    return '<div class="tw"><table style="width:auto"><thead><tr><th>'+title+'</th><th class="n">Bets</th><th class="n">Model said</th><th class="n">Price implied</th><th class="n">Scored</th><th class="n">Units won</th><th class="n">Return a bet</th></tr></thead><tbody>'+
      R.map(function(r){return '<tr><td>'+fmt(r.c)+'</td><td class="n">'+r.n+'</td><td class="n">'+(r.n?p1(r.p/r.n):"–")+'</td><td class="n">'+(r.n?p1(r.be/r.n):"–")+'</td><td class="n"><b>'+(r.n?p1(r.h/r.n):"–")+'</b></td><td class="n">'+(r.n?(r.ret>=0?"+":"")+f1(r.ret):"–")+'</td><td class="n">'+(r.n?'<span class="tag '+(r.ret>0?"w":"l")+'">'+(r.ret>=0?"+":"")+(100*r.ret/r.n).toFixed(1)+'%</span>':"–")+'</td></tr>'}).join("")+'</tbody></table></div>'}
  function pc(c){return Math.round(c[0]*100)+(c[1]<9?"% to "+Math.round(c[1]*100)+"%":"% and up")}
  var money=BT.length?'<h3>Against stored prices · '+Object.keys(priced).length+' games, one unit on every priced skater at the best price</h3>'+
    '<div class="grid2"><div>'+band("Edge","ev",[[-9,-.15],[-.15,0],[0,.1],[.1,.25],[.25,.5],[.5,99]],function(c){return c[0]<-1?"Worse than −15%":c[1]>9?"+50% and up":(c[0]>=0?"+":"")+Math.round(c[0]*100)+"% to "+(c[1]>0?"+":"")+Math.round(c[1]*100)+"%"})+'</div>'+
    '<div>'+band("Model's chance","pr",[[0,.1],[.1,.2],[.2,.3],[.3,.4],[.4,9]],pc)+'</div></div>'+

  view.innerHTML='<section class="panel"><div class="phead"><h2>Tracker · '+lab+'</h2><label class="f">Season '+seg("seg-trks",ss.slice().reverse().map(function(y){return[y,y+"-"+String(y+1).slice(2)]}),cur)+'</label></div>'+

    '<div class="kv">'+rec("Most likely scorer in each game",top1)+rec("Top three in each game",top3)+rec("Top five on each slate",t5)+'</div>'+
    '<h3>Is a 30% call really 30%?</h3>'+cal+money+'</section>'+
    '<section class="panel"><div class="phead"><h2>Slate by slate</h2></div>'+log+(more?'<button class="more" id="trkMore">Show 30 more days</button>':'')+'</section>';

/* ---- generic sortable table ---- */
function table(id,cols,rows,def,opts){
  opts=opts||{};var st=S.sort[id]||def,c=cols.filter(function(x){return x.k===st.k})[0]||cols[0];
  rows=rows.slice().sort(function(a,b){var x=c.v(a),y=c.v(b),nx=x==null||x!==x,ny=y==null||y!==y;if(nx&&ny)return 0;if(nx)return 1;if(ny)return -1;
    var d=typeof x==="string"?x.localeCompare(y):x-y;return st.dir*d||0});
  if(opts.limit)rows=rows.slice(0,opts.limit);
  var h='<div class="tw"><table><thead><tr>'+cols.map(function(x){
    return '<th tabindex="0" data-sort="'+id+'|'+x.k+'"'+(x.num?' class="n"':'')+(x.k===st.k?' aria-sort="'+(st.dir<0?"descending":"ascending")+'"':'')+'>'+x.l+'</th>'}).join("")+'</tr></thead><tbody>';
  h+=rows.map(function(r){var a=opts.row?opts.row(r):"";return '<tr'+a+'>'+cols.map(function(x){return '<td'+(x.num?' class="n"':'')+'>'+(x.f?x.f(r):esc(x.v(r)))+'</td>'}).join("")+'</tr>'}).join("");
  if(!rows.length)h+='<tr><td colspan="'+cols.length+'" class="empty">Nothing matches these filters.</td></tr>';
  return h+'</tbody></table></div>'}

}
function fail(){$("fresh").textContent="No data loaded";
  if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){view.innerHTML='<p class="empty">The first refresh is still downloading the season files. This page reloads itself every 30 seconds until they are in.</p>';setTimeout(function(){location.reload()},30000);return}
  view.innerHTML='<p class="empty">The game data did not load. Reload the page; if it stays empty, rebuild the data with build_data.py.</p>'}
var served=/^https?:$/.test(location.protocol)&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
function say(t){$("refreshMsg").hidden=!t;$("refreshMsg").textContent=t||""}
if(served){
  $("refreshBtn").hidden=false;
  $("refreshBtn").addEventListener("click",function(){var b=this,before=D?D.games.length:0;b.disabled=true;b.textContent="Refreshing…";
    say("Fetching games, injuries and prices. The first run downloads about 100 MB and can take a few minutes.");
    fetch("/refresh",{method:"POST"}).then(function(r){return r.json()}).then(function(d){
      if(d.error){say("Not refreshed: "+d.error+". Showing the data you already had.");return}
      start(d);say((d.games.length-before>0?(d.games.length-before)+" new games added.":"Games already up to date.")+(d.hasKey?"":" No Odds API key found, so no prices: put it in odds_key.txt next to the script.")+(d.note?" "+d.note+".":""));
    }).catch(function(){say("Not refreshed: the local helper did not answer. Start build_data.py --serve again.")})
    .then(function(){b.disabled=false;b.textContent="Refresh"})});
  setInterval(function(){var b=$("refreshBtn");if(D&&!b.disabled&&!document.hidden&&(D.sched||[]).some(function(x){return x.d===todayET()}))b.click()},900000);
}else if(/^https?:$/.test(location.protocol)){ // hosted copy: a scheduled job rebuilds data.json, so pick up the new one without a reload
  setInterval(function(){if(!D||document.hidden)return;fetch("data.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&d.built!==D.built)start(d)}).catch(function(){})},600000);
}else if(location.protocol==="file:"){say("This copy does not update itself. Run python3 build_data.py --install once, then use http://localhost:8766")}
var emb=$("goal-data"),inline=null;
try{if(emb&&emb.textContent.trim())inline=JSON.parse(emb.textContent)}catch(_){}
if(inline)start(inline);
else fetch("data.json").then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(start).catch(fail);
})();
</script>
