<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9A%A8%3C/text%3E%3C/svg%3E"></head><body style="margin:0">
<title>Goal Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column of soft dark cards under pill tabs, the same frame as the Tip-Off Ledger. Single dark theme by design: cold rink-at-night charcoal, ice blue for headings, numbers and controls, green reserved for goals scored and picks that hit. */
:root{
  --bg:#0e1216; --surface:#151b21; --raise:#1c242c; --sunk:#232d37; --ink:#e4ebf1; --soft:#bcc8d3; --muted:#8494a3; --line:#25303a;
  --accent:#6cc4f5; --accent-soft:#132a3a; --accent-ink:#08131b; --made:#63d2b4; --made-soft:#17352e; --miss:#c98d84; --miss-soft:transparent;
  --lv1:#f0a94a; --lv2:#e2d24e; --lv3:#9fdc58; --lv4:#3ef07f; --neg:#e8705f;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1760px;margin:0 auto;padding-inline:24px;padding-block:28px 64px;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.topr{display:flex;align-items:center;gap:22px}
.be{font-size:11.5px;color:var(--muted)}
tbody tr.near>td,tbody tr.near:nth-child(odd)>td{background:rgba(108,196,245,.11)}tbody tr.near>td:first-child{box-shadow:inset 3px 0 0 var(--accent)}.cf{font-weight:600;color:var(--muted)}.cf1{color:var(--lv1)}.cf2{color:var(--lv2)}.cf3{color:var(--lv3)}.cf4{color:var(--lv4)}
.tml{display:inline-flex;align-items:center;gap:.35em;white-space:nowrap;vertical-align:middle}
.tlogo{width:1.5em;height:1.5em;flex:none;object-fit:contain;filter:drop-shadow(0 0 1px rgba(255,255,255,.9)) drop-shadow(0 0 1px rgba(255,255,255,.55))}
td .tlogo{width:22px;height:22px}.lteam h3 .tlogo{width:22px;height:22px}
.at{color:var(--muted);font-weight:400}
.kv.f3{margin-top:-6px}.kv.f3 .o{font-size:12px}
td.rate,th.rate{background:rgba(255,255,255,.035);white-space:nowrap}
td.rate b{font-weight:600}td.rate .chev{vertical-align:-3px;margin-right:6px}
td.rlv1 b{color:var(--lv1)}td.rlv2 b{color:var(--lv2)}td.rlv3 b{color:var(--lv3)}td.rlv4 b{color:var(--lv4)}td.rlv0 b{color:var(--muted);font-weight:500}td.rlvx b{color:var(--muted)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:16px}
.lcard{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lcard.lock{border-color:var(--made);background:linear-gradient(180deg,var(--made-soft),var(--bg) 42%);box-shadow:0 0 0 1px var(--made),0 0 38px -12px var(--made)}
.lhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.lhead .tm{font:600 22px/1 var(--display);letter-spacing:.04em;color:var(--accent);text-transform:uppercase}
.lteams{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.lteam{display:flex;flex-direction:column;gap:8px;min-width:0}
.lteam h3{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--soft)}
.lteam ol{list-style:none;margin:0;padding:0}
.lteam li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:8px 10px;border-radius:8px;font-size:14.5px}
.lteam li:nth-child(odd){background:linear-gradient(90deg,rgba(108,196,245,.17),rgba(108,196,245,.04) 75%,transparent)}
.lteam li:nth-child(even){background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.015) 75%,transparent)}
.lcard.lock .lteam li:nth-child(odd){background:linear-gradient(90deg,rgba(99,210,180,.2),rgba(99,210,180,.04) 75%,transparent)}
.lpos{font:500 11.5px/1 var(--mono);color:var(--muted);width:24px;flex:none;letter-spacing:.02em}
.lteam li .o{margin-left:auto}
.lrep{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--soft)}
.lrep div{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.lrep small{flex-basis:100%;color:var(--muted);font-size:12px;line-height:1.45}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--made);box-shadow:0 0 10px 2px var(--made);display:inline-block;margin-right:6px;vertical-align:1px;animation:lpulse 1.8s ease-in-out infinite}
@keyframes lpulse{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.ldot{animation:none}}
@media(max-width:560px){.lteams{grid-template-columns:1fr}}

@media(min-width:601px){header.top{flex-wrap:nowrap;align-items:center}.topr{flex:none;margin-left:auto}.topr .refresh{max-width:440px}}
.logo{width:72px;height:72px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(108,196,245,.35),0 0 26px 6px rgba(108,196,245,.55),0 0 70px 18px rgba(108,196,245,.22)}
@media(max-width:600px){.logo{width:52px;height:52px}.topr{gap:14px;width:100%;justify-content:space-between}}
h1{font:700 46px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:8px 0 0;letter-spacing:.02em}
.fresh{font:400 12px/1.5 var(--mono);color:var(--muted);text-align:right}
.refresh{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.refresh button{font:600 13px var(--body);color:var(--accent-ink);background:var(--accent);border:0;border-radius:999px;padding:9px 18px;cursor:pointer}
.refresh button:hover{filter:brightness(1.08)}
.refresh button:disabled{opacity:.6;cursor:progress}
#refreshMsg{max-width:90ch}
h2{font:600 26px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0;text-wrap:balance;color:var(--accent)}
h3{font:500 11.5px/1.2 var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:10px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:600 16px var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--soft);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 18px;cursor:pointer}
.tabs button:hover{background:var(--raise)}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);padding:3px;gap:2px}
.seg button{font:500 13px var(--body);color:var(--muted);background:none;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-left:auto}
label.f{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
select,input[type=search]{font:500 14px var(--body);color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:100%}
button:focus-visible,select:focus-visible,input:focus-visible,tr[tabindex]:focus-visible,th[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.phead{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.note{color:var(--muted);font-size:13.5px;margin:0;line-height:1.6}
.note b{color:var(--soft);font-weight:500}
.tw{overflow-x:auto;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:11px 16px;text-align:left;white-space:nowrap}
th{font:500 11px/1.2 var(--body);text-transform:uppercase;letter-spacing:.11em;color:var(--muted);vertical-align:bottom;border-bottom:1px solid var(--line);padding-block:12px}
tbody tr+tr td{border-top:1px solid var(--line)}
tbody tr:nth-child(odd) td{background:color-mix(in srgb,var(--surface) 55%,var(--bg))}
th[tabindex]{cursor:pointer}
th[tabindex]:hover{color:var(--ink)}
th[aria-sort]{color:var(--accent)}
th[aria-sort]:after{content:" ▾"}
th[aria-sort="ascending"]:after{content:" ▴"}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.n{color:var(--soft)}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--raise)}
tbody tr.on td{background:var(--accent-soft)}
.tm{font:600 16px var(--display);letter-spacing:.07em}
.meter{display:inline-block;width:64px;height:6px;background:var(--sunk);border-radius:999px;vertical-align:middle;margin-left:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
/* matchup */
.pickers{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pickers .vs{font:600 18px var(--display);color:var(--muted);letter-spacing:.08em}
.circle{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px 24px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:20px 24px}
.side{display:flex;flex-direction:column;gap:6px;min-width:0;align-items:flex-start}
.side select{max-width:100%}
.side h3{margin:0}
.side.r{text-align:right;align-items:flex-end}
.big{font:700 48px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.who{font:600 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;overflow-wrap:anywhere}
.mid{width:144px;height:144px;border:1px solid var(--line);background:var(--surface);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}
.midw{display:flex;flex-direction:column;align-items:center;gap:8px}
.hh{font-size:12px;color:var(--muted);letter-spacing:.04em}.harr{font-size:8px;letter-spacing:-1px;vertical-align:1px}.hh b{color:var(--ink);font-weight:500}
.chev{width:86px;height:28px;display:block;flex:none;--c:var(--muted)}
.chev.sm{width:58px;height:19px}
td .chev{display:inline-block;vertical-align:middle}
.chev.lv1{--c:var(--lv1)}.chev.lv2{--c:var(--lv2)}.chev.lv3{--c:var(--lv3)}.chev.lv4{--c:var(--lv4)}
.chev polyline{fill:none;stroke:var(--sunk);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.chev polyline.on{stroke:var(--c);filter:drop-shadow(0 0 4px var(--c))}
.chev.off polyline.on,.mid.off .chev polyline.on{stroke:var(--muted);filter:none}
.rl .rname{min-width:0}
.mid b{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.mid span{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.kv{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:13.5px;color:var(--muted);align-items:baseline}
.kv b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.side.r .kv{justify-content:flex-end}
/* play-by-play shot lines */
.seq{display:flex;flex-direction:column;gap:7px;font-size:13.5px;line-height:1.4}
.shot{display:grid;grid-template-columns:1.2em 3.2em minmax(0,1fr) auto;gap:10px;align-items:baseline}
.shot .o,.shot>span:nth-child(2){color:var(--muted);font-variant-numeric:tabular-nums}
.shot .p{overflow-wrap:anywhere;min-width:0}
.shot .p em{font-style:normal;color:var(--muted)}
.res{display:inline-block;font:600 10.5px/1 var(--body);letter-spacing:.07em;padding:4px 9px;border-radius:999px;vertical-align:middle;border:1px solid transparent}
.res.m{color:var(--accent-ink);background:var(--made)} .res.x{color:var(--muted);border-color:var(--line)}
.gamecard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.gamecard .gh{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:center;font-size:13px;color:var(--soft)}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:12px}
.tag{display:inline-block;font:600 10.5px/1 var(--body);letter-spacing:.07em;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.tag.w{background:var(--made-soft);border-color:transparent;color:var(--made)} .tag.l{color:var(--miss)}
.mix{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 14px;align-items:center;font-size:13.5px;max-width:600px;color:var(--soft)}
.mix .track{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.mix .track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.mix .v{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
td.cell{white-space:nowrap;font-size:13.5px;line-height:1.9;vertical-align:top}
td.cell .o,td.n .o,td .o{color:var(--muted)}
table[style] th,table[style] td{padding-right:32px}
.tw:has(>table[style]){align-self:flex-start;max-width:100%}
.edge{display:inline-block;font:600 12.5px/1 var(--body);letter-spacing:.04em;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
section[id^="pick-"],section[id^="game-"]{scroll-margin-top:16px}
h2.sep{margin-top:12px;color:var(--muted)}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.rcard{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;cursor:pointer;min-width:0}
.rcard:hover{border-color:var(--accent)}
.rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rhead{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.rhead .tm{font-size:22px;color:var(--accent)}
.rblock{display:flex;flex-direction:column;gap:6px}
.rblock h3{margin:0}
.rname{font:600 20px/1.15 var(--display);text-transform:uppercase;letter-spacing:.04em}
.rcard ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:s}
.rcard li{counter-increment:s;display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.rcard li+li{border-top:1px solid var(--line);padding-top:12px}
.rl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rl.pk{flex-direction:column;align-items:stretch;gap:4px}.rl.pk>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding-left:1.5em;font-size:13px}
.rq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted);padding-left:1.5em}
.rq .tag{min-width:38px;text-align:center}
.rcard li .rl>span:first-child:before{content:counter(s);color:var(--accent);font-weight:600;display:inline-block;width:1.5em}
.rcard .o{color:var(--muted);font-size:13px;white-space:nowrap}
.rcard.win{border-color:var(--made);background:linear-gradient(180deg,var(--made-soft),var(--bg) 55%);box-shadow:0 0 0 1px var(--made),0 10px 30px -18px var(--made)}
.rcard.win .rhead .tm{color:var(--made)}
.rcard.win .edge{background:var(--made);color:var(--accent-ink)}
.rcard.win .edge:after{content:" · WIN"}
.rres .hit>span:last-child,.rcard li.hit .rl>span:first-child{color:var(--made);font-weight:600}
.rcard li.hit .rl>span:first-child:before{color:var(--made)}
.tag.q{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.rf{display:flex;flex-wrap:wrap;gap:6px;padding-left:1.5em;align-items:center}
.rf .o{font-size:12px;color:var(--muted)}
.side.r .rf{justify-content:flex-end}.side .rf{padding-left:0}
.rcard.warn .edge{opacity:.5}
.inj{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13.5px;color:var(--soft)}
.px{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.px.v4{color:var(--lv4)}.px.v3{color:var(--lv3)}.px.v2{color:var(--lv1)}.px.v1{color:var(--neg)}
.rval{border-top:1px solid var(--line);padding-top:12px}
.rval .rq{padding-left:0}.rval .rq>span:nth-child(even){text-align:right;color:var(--ink)}
.rval.hit .rl>span:first-child{color:var(--made);font-weight:600}
.rres{border-top:1px solid var(--line);padding-top:12px;font-size:13.5px}
.rres>div{display:flex;justify-content:space-between;gap:10px;align-items:center}
.picks{display:flex;flex-direction:column;gap:20px}
.more{align-self:flex-start;font:500 13px var(--body);color:var(--soft);background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.more:hover{color:var(--accent);border-color:var(--accent)}
.more:disabled{opacity:.4;cursor:default;color:var(--muted);border-color:var(--line)}
.empty{color:var(--muted);padding:28px 0;text-align:center}
@media (max-width:1300px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .wrap{padding-inline:16px}.panel{padding:16px}
  h1{font-size:36px}.grid2{grid-template-columns:minmax(0,1fr)}.filters{margin-left:0}.fresh{text-align:left}.refresh{align-items:flex-start}
  .circle{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:16px}.midw{grid-column:1/-1;grid-row:1;justify-self:center}.mid{width:124px;height:124px}
  .big{font-size:38px} th,td{padding:10px 12px}
}
@media (prefers-reduced-motion:no-preference){.tabs button,.seg button,.more,.refresh button{transition:background .15s,color .15s,border-color .15s}}
[hidden]{display:none!important}

/* additions for the Goal Ledger */
.px.c1{color:var(--lv1)}.px.c2{color:var(--lv2)}.px.c3{color:var(--lv3)}.px.c4{color:var(--lv4)}
li.pick,span.pick{cursor:pointer}li.pick:hover{outline:1px solid var(--accent)}span.pick:hover{color:var(--accent)}
li.pick:focus-visible,.rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pxin{width:74px;font:500 13.5px var(--mono);color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:5px 8px;text-align:right}
.pxin::placeholder{color:var(--muted);opacity:.6}
.gksel{font-size:13px;padding:4px 8px;border-radius:8px;max-width:100%}
.calbar{position:relative;width:min(280px,40vw);height:16px}
.calbar i,.calbar b{position:absolute;left:0;display:block;border-radius:999px}
.calbar i{top:1px;height:5px;background:var(--muted)}.calbar b{top:9px;height:6px;background:var(--made)}
.lteam h3 .o{text-transform:none;letter-spacing:.02em}
.rcard .rq{padding-left:0}.rcard .rq>span:nth-child(even){text-align:right;color:var(--ink)}
.rcard .rf{padding-left:0}
.panel>.bar{gap:12px 22px}
.tabs button .o{color:var(--muted);font-weight:500}

/* corner mark */
svg.logo{color:var(--ink);background:var(--bg)}
/* never more than two game cards in a row */
.lgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1100px){.lgrid{grid-template-columns:minmax(0,1fr)}}
/* logos sit beside text without lifting it off the line */
.tml{display:inline;white-space:nowrap;vertical-align:baseline}
.tlogo{display:inline-block;vertical-align:middle;margin-right:.3em;position:relative;top:-.08em}
.lhead .tm,.rhead .tm{display:inline-flex;align-items:baseline;gap:.35em;flex-wrap:wrap}
.lhead,.rhead{align-items:center}
.lteam h3{align-items:baseline}
.lteam .kv{align-items:center}.lteam .kv>span{min-width:0;max-width:100%}
.gksel{display:block;width:100%;margin-top:4px}
.lteam li{align-items:baseline}.lteam li .tag,.lteam li .res{align-self:center}

/* game cards: one matchup per row of the page */
.lgrid{grid-template-columns:minmax(0,1fr)}
/* player rows: name and tags on the left, chance, price, fair price and edge in fixed columns on the right, one line, every row the same height */
.lteam li.prow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:0 12px;padding:0 12px;height:42px}
.prow .pn{display:flex;align-items:center;gap:10px;min-width:0}
.prow .pname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prow .ptags{display:flex;gap:6px;align-items:center;flex:none}
.prow .pv{display:grid;gap:0 12px;align-items:center;justify-items:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.prow .pv4{grid-template-columns:56px 58px 82px 58px}
.prow .pv2{grid-template-columns:56px 76px}
.prow .pv b{color:var(--ink);font-weight:600}
.prow .pv .o{margin-left:0;font-size:13px}
.lteam li.prow .tag,.lteam li.prow .res{align-self:auto}
@media(max-width:760px){ /* too narrow for one line: name over tags, chance and price over fair and edge */
  .lteam li.prow{height:60px;padding:0 10px}
  .prow .pn{flex-direction:column;align-items:stretch;gap:5px;overflow:hidden}
  .prow .pname{max-width:100%}
  .prow .ptags{height:19px}
  .prow .pv4{grid-template-columns:auto auto;gap:3px 8px}
  .prow .pv2{grid-template-columns:auto;gap:3px}
}

/* compact tables that must fit two side by side */
.tight th,.tight td{padding:9px 10px}
.tight th:first-child,.tight td:first-child{padding-left:14px}
.tight th:last-child,.tight td:last-child{padding-right:14px}

/* edge pills: one scale everywhere, deep red to bright green, so size reads at a glance */
:root{--eg-n3:#6b211d;--eg-n3t:#ffc2b8;--eg-n2:#3d1b19;--eg-n2t:#eba095;--eg-n1t:#b98a84;--eg-p1:#12302a;--eg-p1t:#74cdb4;--eg-p2:#1b574a;--eg-p2t:#b4f5e2;--eg-p3:#3fbf9b;--eg-p4:#3ef07f;--eg-dark:#06140f}
.tag.eg{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;border-color:transparent}
.tag.eg.n3{background:var(--eg-n3);color:var(--eg-n3t)}
.tag.eg.n2{background:var(--eg-n2);color:var(--eg-n2t)}
.tag.eg.n1{background:transparent;border-color:var(--line);color:var(--eg-n1t)}
.tag.eg.p1{background:var(--eg-p1);color:var(--eg-p1t)}
.tag.eg.p2{background:var(--eg-p2);color:var(--eg-p2t)}
.tag.eg.p3{background:var(--eg-p3);color:var(--eg-dark)}
.tag.eg.p4{background:var(--eg-p4);color:var(--eg-dark);box-shadow:0 0 10px -2px var(--eg-p4)}

.prow .pv4.pvl,.phd .pv4.pvl{grid-template-columns:56px 58px 92px 58px 46px 76px}
.prow .vsc{font-weight:600;color:var(--ink)}
@media(max-width:760px){.prow .pv4.pvl{grid-template-columns:auto auto auto}}
@media(max-width:760px){.panel .bar label.f{flex-wrap:wrap}.panel .bar .seg{flex-wrap:wrap;border-radius:16px}}

/* value score: tinted text on the edge scale (no pill, so it does not compete with the edge pill beside it) */
:root{--vs-n3:#ff9d8f;--vs-n2:#e08a7e;--vs-n1:#a98f8b;--vs-p1:#8fbfb2;--vs-p2:#63d2b4;--vs-p3:#5fe6b0;--vs-p4:#3ef07f}
.vst{font-weight:600;font-variant-numeric:tabular-nums}
.vst.n3{color:var(--vs-n3)}.vst.n2{color:var(--vs-n2)}.vst.n1{color:var(--vs-n1)}
.vst.p1{color:var(--vs-p1)}.vst.p2{color:var(--vs-p2)}.vst.p3{color:var(--vs-p3)}.vst.p4{color:var(--vs-p4);text-shadow:0 0 10px color-mix(in srgb,var(--vs-p4) 55%,transparent)}
.prow .pv b.vst.n3{color:var(--vs-n3)}.prow .pv b.vst.n2{color:var(--vs-n2)}.prow .pv b.vst.n1{color:var(--vs-n1)}
.prow .pv b.vst.p1{color:var(--vs-p1)}.prow .pv b.vst.p2{color:var(--vs-p2)}.prow .pv b.vst.p3{color:var(--vs-p3)}.prow .pv b.vst.p4{color:var(--vs-p4)}

/* tonight's running tally beside the pick cards */
.tag.nt{font-size:12.5px;padding:8px 14px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.tag.nt.l{border-color:var(--line);color:var(--miss)}

/* goal light: a pick card whose player has scored glows and pulses red, like the lamp behind the net */
:root{--goal:#ff3b30;--goal-hot:#ff6a5e;--goal-soft:#3d100d;--goal-ink:#1a0504}
.rcard.win{border-color:var(--goal);background:linear-gradient(180deg,var(--goal-soft),var(--bg) 60%);box-shadow:0 0 0 1px var(--goal),0 0 26px -4px var(--goal);animation:goallight 1.5s ease-in-out infinite}
@keyframes goallight{0%,100%{box-shadow:0 0 0 1px var(--goal),0 0 14px -6px var(--goal)}50%{box-shadow:0 0 0 2px var(--goal-hot),0 0 46px 2px var(--goal)}}
.rcard.win .rhead .tm,.rcard.win .rhead .tm .at{color:var(--goal-hot)}
.rcard.win .rname{color:var(--goal-hot);text-shadow:0 0 18px color-mix(in srgb,var(--goal) 60%,transparent)}
.rcard.win .rblock h3{color:var(--goal-hot)}
.rcard.win .res.m{background:var(--goal);color:#fff;box-shadow:0 0 12px var(--goal)}
.rcard.win .rval{border-top-color:color-mix(in srgb,var(--goal) 45%,var(--line))}
.rcard.win .chev polyline.on{stroke:var(--goal-hot);filter:drop-shadow(0 0 4px var(--goal))}
.rcard.win:hover{border-color:var(--goal-hot)}
.rcard.win .edge{background:var(--goal);color:#fff}
@media(prefers-reduced-motion:reduce){.rcard.win{animation:none;box-shadow:0 0 0 1px var(--goal),0 0 30px -4px var(--goal)}}

/* game-card rows: chance, best price with the book, fair price, edge, value score; and a header line naming the columns */
.prow .pv4.pvg,.phd .pv4.pvg{grid-template-columns:56px 92px 64px 58px 46px}
.prow .pxb{display:inline-flex;align-items:baseline;gap:6px;justify-content:flex-end}
.bk{font:500 10px/1 var(--mono);letter-spacing:.04em;color:var(--muted);min-width:26px;text-align:left}
.phd{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:0 12px;padding:0 12px 4px;font:500 10.5px/1.2 var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.phd .pv{display:grid;gap:0 12px;justify-items:end;white-space:nowrap}
@media(max-width:760px){.phd{display:none}.prow .pv4.pvg{grid-template-columns:auto auto auto}}

.phd .hs{cursor:pointer;border-radius:4px}.phd .hs:hover{color:var(--ink)}
.phd .hs.on{color:var(--accent)}.phd .hs.on:after{content:" ▾"}
.phd .hs:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* goal light on the player rows too: a scorer's row on the game cards and Lineups glows red.
   The pulse fades one overlay's opacity, which the browser can do without repainting the row. */
.lteam li.prow.win{position:relative;background:linear-gradient(90deg,color-mix(in srgb,var(--goal) 34%,var(--bg)),var(--goal-soft) 55%,color-mix(in srgb,var(--goal) 12%,var(--bg)));box-shadow:inset 3px 0 0 var(--goal),inset 0 0 0 1px color-mix(in srgb,var(--goal) 55%,transparent)}
.lteam li.prow.win::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:color-mix(in srgb,var(--goal) 22%,transparent);box-shadow:0 0 16px -2px var(--goal);opacity:0;animation:rowlight 1.6s ease-in-out infinite;will-change:opacity}
@keyframes rowlight{0%,100%{opacity:0}50%{opacity:1}}
.lteam li.prow.win .pname{color:#fff}
.lteam li.prow.win .lpos{color:var(--goal-hot)}
.lteam li.prow.win .res.m{background:var(--goal);color:#fff}
@media(prefers-reduced-motion:reduce){.lteam li.prow.win::after{animation:none}}

/* and on the Slate table: steady red, no animation, because a full slate can have dozens of scorers and hundreds of cells */
tbody tr.glit>td,tbody tr.glit:nth-child(odd)>td{background:color-mix(in srgb,var(--goal) 18%,var(--bg))}
tbody tr.glit>td:first-child{box-shadow:inset 3px 0 0 var(--goal);background:color-mix(in srgb,var(--goal) 30%,var(--bg));color:#fff}
tbody tr.glit>td:nth-child(2){background:color-mix(in srgb,var(--goal) 26%,var(--bg))}
tbody tr.glit .res.m{background:var(--goal);color:#fff}

/* every book's price for one player, shown on hover, focus or tap of a price */
.pxh{cursor:help;border-bottom:1px dotted color-mix(in srgb,var(--muted) 70%,transparent)}
.pxh:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.bktip{position:fixed;z-index:50;display:none;min-width:190px;padding:10px 12px;border-radius:10px;background:var(--raise);border:1px solid var(--line);box-shadow:0 12px 32px -8px rgba(0,0,0,.65);font-size:13px;pointer-events:none}
.bktip .bkh{font-weight:600;color:var(--ink);margin-bottom:6px;display:flex;justify-content:space-between;gap:14px;white-space:nowrap}
.bktip .bkh span{font-weight:400;color:var(--muted);font-size:12px}
.bktip .bkr{display:flex;justify-content:space-between;gap:18px;padding:3px 0;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bktip .bkr b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.bktip .bkr.top span,.bktip .bkr.top b{color:var(--hit,#4ade80)}
.bktip .bkr.at span::after{content:" · shown";color:var(--muted);font-size:11.5px}

/* game time on pick cards, and the jump strip of games at the top of Lineups */
.rblock h3 .rtime{float:right;font:500 12.5px/1.2 var(--mono);letter-spacing:0;color:var(--soft);text-transform:none}
.jumps{display:flex;flex-wrap:wrap;gap:8px}
.jumps button{font:500 14px var(--body,inherit);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.jumps button span{color:var(--muted);font:500 12.5px var(--mono);margin-left:6px}
.jumps button:hover{background:var(--raise);border-color:var(--accent)}
.lcard{scroll-margin-top:12px}

/* goals feed */
.fwhen{font:500 13px var(--mono);color:var(--ink)}
.lposi{font:500 11.5px var(--mono)}
.tag.fg{border-color:color-mix(in srgb,var(--goal) 60%,var(--line));color:var(--goal-hot)}
.tag.pk{background:var(--goal);border-color:var(--goal);color:#fff}
.tag.nt.pkc{border-color:var(--goal);color:var(--goal-hot)}
tbody tr.ffirst>td:first-child{box-shadow:inset 3px 0 0 var(--goal)}
tbody tr.fpick>td,tbody tr.fpick:nth-child(odd)>td{background:color-mix(in srgb,var(--goal) 20%,var(--bg));animation:feedlight 1.6s ease-in-out infinite}
tbody tr.fpick>td:first-child{box-shadow:inset 4px 0 0 var(--goal-hot)}
@keyframes feedlight{0%,100%{background-color:color-mix(in srgb,var(--goal) 14%,var(--bg))}50%{background-color:color-mix(in srgb,var(--goal) 32%,var(--bg))}}
@media(prefers-reduced-motion:reduce){tbody tr.fpick>td{animation:none}}
td .bk{margin-left:6px}

/* shots tab */
:root{--lad:#f5b942}
.tag.lad{background:var(--lad);border-color:var(--lad);color:#1a1204;font-weight:700}
.tag.nt.ladc{border-color:color-mix(in srgb,var(--lad) 70%,var(--line));color:var(--lad)}
tbody tr.ladr>td:first-child{box-shadow:inset 3px 0 0 var(--lad)}
tbody tr.ladr>td,tbody tr.ladr:nth-child(odd)>td{background:color-mix(in srgb,var(--lad) 7%,var(--bg))}

.sside{font:700 15px var(--display);letter-spacing:.06em;padding:5px 11px;border-radius:8px;border:1px solid var(--line);white-space:nowrap}
.sside.o{color:var(--made,#4ade80);border-color:color-mix(in srgb,var(--made,#4ade80) 50%,var(--line))}
.sside.u{color:var(--goal-hot);border-color:color-mix(in srgb,var(--goal) 55%,var(--line))}
/* a winning Shot Pick lights up in the dashboard's own blue; red is kept for goals */
.rcard.swin{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--bg) 60%);box-shadow:0 0 0 1px var(--accent),0 0 22px -6px var(--accent)}
.rcard.swin .rname{color:var(--accent)}
.rcard.swin .sside.o{color:#04130d;border-color:var(--made,#4ade80);background:var(--made,#4ade80)}
.rcard.swin .sside.u{color:#fff;border-color:var(--goal);background:var(--goal)}
.rcard.swin .res.m{background:var(--accent);color:var(--accent-ink,#06131c)}
.tag.spkt{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#06131c)}
tbody tr.spk>td:nth-child(2) b{color:var(--accent)}

.res.live{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));color:var(--accent)}

/* shots table results: outlined green for over the line, outlined red for under */
.res.so{color:var(--made,#4ade80);border-color:color-mix(in srgb,var(--made,#4ade80) 60%,var(--line))}
.res.su{color:var(--goal-hot);border-color:color-mix(in srgb,var(--goal) 60%,var(--line))}

/* player page: headshot card on the team's colour, beside the name and game log */
.pprof{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:stretch}
.pprof .pmain{min-width:0}
.pphoto{position:relative;min-height:280px;height:100%;border-radius:16px;overflow:hidden;border:1.5px solid color-mix(in srgb,var(--tc) 55%,var(--accent));
  background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 85%,#000) 0%,color-mix(in srgb,var(--tc) 45%,var(--bg)) 55%,var(--bg) 100%);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--tc) 35%,transparent),0 10px 30px -14px var(--tc)}
.pphoto img{position:absolute;top:42%;left:50%;width:190%;max-width:none;height:auto;display:block;transform:translate(-50%,-50%)}
.pphoto .pini{position:absolute;inset:0;display:grid;place-items:center;font:700 64px var(--display);letter-spacing:.04em;color:color-mix(in srgb,#fff 28%,transparent)}
@media(max-width:760px){.pprof{grid-template-columns:1fr}.pphoto{width:170px;height:215px;min-height:0;margin:0 auto}}
/* the game log shows five games and scrolls for the rest; the header row stays put */
.pprof .pmain{display:flex;flex-direction:column}
.pprof .plog{flex:none;height:calc(38px + 5 * 50px);overflow-y:auto;margin-top:10px;scrollbar-width:thin}
.pprof .plog thead th{position:sticky;top:0;z-index:1;background:var(--surface)}
.pprof .plog tbody td{height:50px;box-sizing:border-box}

/* picks that were listed earlier today and have since dropped off */
.dropped{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;font-size:13.5px}
.dropped small{flex-basis:100%;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.dropped .pick{cursor:pointer;white-space:nowrap}

/* wide tables: the first three columns stay anchored while the rest scrolls sideways */
table.pin3 th:nth-child(-n+3),table.pin3 td:nth-child(-n+3){position:sticky;z-index:2}
table.pin3 th:nth-child(1),table.pin3 td:nth-child(1){left:0}
table.pin3 th:nth-child(2),table.pin3 td:nth-child(2){left:var(--p1,0px)}
table.pin3 th:nth-child(3),table.pin3 td:nth-child(3){left:var(--p2,0px)}
:where(table.pin3) td:nth-child(-n+3){background:var(--bg)}
table.pin3 thead th:nth-child(-n+3){z-index:3;background:var(--pinhead,var(--bg))}
table.pin3 th:nth-child(3)::after,table.pin3 td:nth-child(3)::after{content:"";position:absolute;top:0;bottom:0;right:-1px;width:1px;background:var(--line);box-shadow:6px 0 10px -2px rgba(0,0,0,.55)}

/* rung value: a mispriced higher rung on a player the model and market agree about */
:root{--rv:#b98cff}
.tag.rvt{background:color-mix(in srgb,var(--rv) 22%,var(--bg));border-color:var(--rv);color:var(--rv);font-weight:700}
.tag.nt.rvc{border-color:color-mix(in srgb,var(--rv) 70%,var(--line));color:var(--rv)}
tbody tr.rvr>td:first-child{box-shadow:inset 3px 0 0 var(--rv)}

/* player card: opens over the page */
.pm-back{position:fixed;inset:0;z-index:40;display:none;align-items:flex-start;justify-content:center;padding:36px 16px;background:rgba(4,7,10,.9);overflow:hidden}
.pm{width:min(1100px,100%);max-height:calc(100vh - 72px);max-height:calc(100dvh - 72px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px -20px #000;scrollbar-width:thin}
.pm-head{position:relative;display:flex;align-items:flex-end;gap:22px;height:176px;padding:0 28px;overflow:hidden;border-radius:17px 17px 0 0;
  background:linear-gradient(90deg,color-mix(in srgb,var(--tc2) 42%,transparent) 0%,color-mix(in srgb,var(--tc2) 14%,transparent) 20%,transparent 38%),linear-gradient(100deg,color-mix(in srgb,var(--tc) 92%,#000) 0%,color-mix(in srgb,var(--tc) 68%,#000) 100%)}
.pm-wm{position:absolute;right:-60px;top:50%;height:230%;transform:translateY(-50%);opacity:.3;pointer-events:none}
.pm-mug{position:relative;flex:none;width:176px;height:176px;align-self:flex-end}
.pm-mug img{position:absolute;left:50%;bottom:0;width:112%;max-width:none;transform:translateX(-50%);filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.pm-mug span{position:absolute;inset:0;display:grid;place-items:center;font:700 20px var(--display);letter-spacing:.06em;color:rgba(255,255,255,.3)}
.pm-mug.has span{display:none}
.pm-id{position:relative;align-self:center;min-width:0}
.pm-id h2{margin:0;font:700 34px/1.05 var(--display);letter-spacing:.03em;text-transform:uppercase;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.pm-sub{margin-top:8px;display:flex;align-items:center;gap:8px;font:600 13px var(--display);letter-spacing:.09em;text-transform:uppercase;color:#fff}
.pm-sub span{color:rgba(255,255,255,.85)}
.pm-x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);background:rgba(0,0,0,.45);color:#fff;font:400 22px/1 var(--body);cursor:pointer}
.pm-x:hover,.pm-x:focus-visible{background:rgba(0,0,0,.7);outline:none;border-color:#fff}
.pm-body{padding:20px 26px 40px}
.pm-seas{display:flex;justify-content:flex-end;margin-bottom:12px}
.pm-tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media(max-width:760px){.pm-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pm-tile{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 13px;min-width:0}
.pm-tile small{display:block;font:500 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pm-tile b{display:block;margin:5px 0 3px;font:600 24px/1.1 var(--body);font-variant-numeric:tabular-nums;color:var(--ink)}
.pm-tile span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.pm-body h4{margin:20px 0 8px;font:600 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--tc-ink,var(--accent))}
.pm-next{margin:0;font-size:14px;line-height:1.65;color:var(--soft)}
.pm-next b{color:var(--ink)}
.pm-log{max-height:calc(38px + 3 * 42px);overflow-y:auto;scrollbar-width:thin}
.pm-log thead th{position:sticky;top:0;z-index:1;background:var(--bg)}
.pm-log td{padding-block:0;height:42px;box-sizing:border-box}
.pm-more{display:block;margin:18px 0 0;width:100%;box-sizing:border-box;padding:11px 14px}
.pm-work{margin-top:14px}
@media(max-width:760px){.pm-back{padding:0}.pm{max-height:100vh;border-radius:0;border:0}.pm-head{height:132px;padding:0 16px;gap:12px;border-radius:0}.pm-mug{width:120px;height:132px}.pm-id h2{font-size:23px}.pm-wm{display:none}.pm-body{padding:16px 14px 22px}}

/* trend arrows: last 10 games against the 20 before */
.trd{font:600 11.5px var(--mono);margin-left:4px;white-space:nowrap}
.trd.up{color:var(--made,#4ade80)}.trd.dn{color:var(--goal-hot)}.trd.fl{color:var(--muted)}

/* ladder watch */
.lwt td{vertical-align:middle}
.lwt .lwline{color:var(--lad);font-weight:700}
.lwt td.lwbar{box-shadow:inset 3px 0 0 var(--lad)}
.lwc{display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:74px;padding:7px 10px;border-radius:10px;border:1.5px solid transparent;font-variant-numeric:tabular-nums;line-height:1.25}
.lwc b{font:600 14.5px var(--mono);color:var(--ink)}
.lwc .lwp{color:var(--made,#4ade80);font-size:12.5px}.lwc .lwn{color:var(--muted);font-size:12.5px}

function playerAgg(){ // per-player totals over the filtered games, honouring the Window switch per player
  var by={};G.forEach(function(g){[g.h,g.a].forEach(function(t){g.p[t].forEach(function(r){(by[r[0]]=by[r[0]]||[]).push({g:g,t:t,r:r})})})});
  return Object.keys(by).map(function(p){var l=lastN(by[p]),x={p:+p,name:pname(p),pos:ppos(p),team:l[l.length-1].t,gp:l.length,g:0,sog:0,fen:0,xg:0,toi:0,pp:0,ppg:0,eng:0,a1:0,hd:0,sc:0,pred:0};
    l.forEach(function(e){var r=e.r;x.g+=r[1];x.sog+=r[2];x.fen+=r[3];x.xg+=(r[4]+r[5])/1000;x.toi+=r[6];x.pp+=r[7];x.ppg+=r[8];x.eng+=r[9];x.a1+=r[10];x.hd+=r[11];if(r[1])x.sc++;var pr=IX.PRE[e.g.id][p];x.pred+=1-Math.exp(-pr[0])});
    return x})}
function teamAgg(){
  var by={};G.forEach(function(g){[g.h,g.a].forEach(function(t){(by[t]=by[t]||[]).push(g)})});
  return Object.keys(by).sort().map(function(t){var l=lastN(by[t]),x={t:t,gp:l.length,gf:0,ga:0,xgf:0,xga:0,sf:0,sa:0,ppf:0,ppa:0,ppg:0,ppga:0,enf:0,ena:0};
    l.forEach(function(g){var a=g.t[t],b=g.t[opp(g,t)];x.gf+=a[0];x.ga+=b[0];x.xgf+=a[3]/100;x.xga+=b[3]/100;x.sf+=a[1];x.sa+=b[1];x.ppf+=a[4];x.ppa+=b[4];x.ppg+=a[6];x.ppga+=b[6];x.enf+=a[7];x.ena+=b[7]});return x})}
function goalieAgg(){
  var by={};G.forEach(function(g){[g.h,g.a].forEach(function(t){g.g[t].forEach(function(k){(by[k[0]]=by[k[0]]||[]).push({g:g,t:t,k:k})})})});
  return Object.keys(by).map(function(p){var l=lastN(by[p]),x={p:+p,name:pname(p),team:l[l.length-1].t,gp:l.length,st:0,sa:0,ga:0,xga:0};
    l.forEach(function(e){x.st+=e.k[4];x.sa+=e.k[1];x.ga+=e.k[2];x.xga+=e.k[3]/100});return x})}

function seenOf(day,kind){var L=(D.locks||{})[day],o=L&&(kind==="s"?L.seenS:L.seenG);return o?Object.keys(o).map(function(k){return o[k]}).sort(function(a,b){return String(a.at0).localeCompare(String(b.at0))}):[]}

  if(kind==="s"&&e.closeLine!=null&&e.closeLine!==e.line)return{moved:1,beat:(e.side==="o")===(e.closeLine>e.line)?1:-1,pts:null};
  if(e.close==null)return null;var d=1/payout(e.close)-1/payout(e.price0);return{beat:d>1e-9?1:d<-1e-9?-1:0,pts:d}}

  if(kind==="s")return shotGrade(e.side,e.line,shotAct(r));
  if(!r.res)return null;return r.res[1]>0?1:(r.info.m.g||/OFF|FINAL/.test(r.info.m.st||""))?-1:null}

  return fmtP(e.close)+' <span class="tag eg '+(c.beat>0?"p2":c.beat<0?"n2":"n1")+'">'+(c.beat>0?"BEAT":c.beat<0?"WORSE":"SAME")+'</span>'}

/* ---- boot: data embedded in the file if present, otherwise data.json next to the page ---- */

    Object.keys(S.px).forEach(function(k){if(k.slice(0,10)<today)delete S.px[k]});Object.keys(S.goalie).forEach(function(k){if(k.slice(0,10)<today)delete S.goalie[k]})}

function fail(){$("fresh").textContent="No data loaded";
  if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){view.innerHTML='<p class="empty">The first refresh is still downloading the season files. This page reloads itself every 30 seconds until they are in.</p>';setTimeout(function(){location.reload()},30000);return}
  view.innerHTML='<p class="empty">The game data did not load. Reload the page; if it stays empty, rebuild the data with build_data.py.</p>'}
var served=/^https?:$/.test(location.protocol)&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname);

}else if(/^https?:$/.test(location.protocol)){ // hosted copy: a scheduled job rebuilds data.json, so pick up the new one without a reload
  setInterval(function(){if(!D||document.hidden)return;fetch("data.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&d.built!==D.built)start(d)}).catch(function(){})},600000);

/* ---- live goals: while games are on, the page itself asks ESPN's public scoreboard once a minute, so a goal shows up without
   waiting for the half-hourly rebuild. Nothing is stored; the overnight archive remains the record. ---- */
var LIVE={},ESPN="https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/",EAB={TB:"TBL",SJ:"SJS",NJ:"NJD",LA:"LAK",UTAH:"UTA",UTH:"UTA",VGS:"VGK",WAS:"WSH",MON:"MTL",CLB:"CBJ",NAS:"NSH",WIN:"WPG",CAL:"CGY"};
function eab(x){return EAB[x]||x}
function applyLive(){var ch=0;(D.sched||[]).forEach(function(m){var L=LIVE[gameKey(m)];if(!L)return;
  var sig=JSON.stringify([L.gl,L.sc,L.st,(L.ge||[]).length,L.sg]);if(m._live!==sig){m._live=sig;m.gl=L.gl;m.sc=L.sc;m.st=L.st;if(L.sg)m.sg=L.sg;ch=1}});return ch}
function liveShots(doc,t){ // shots on goal by player id for one team, from ESPN's box score; an empty object if the column cannot be found
  var out={};((doc.boxscore||{}).players||[]).forEach(function(tm){if(eab((tm.team||{}).abbreviation)!==t)return;
    (tm.statistics||[]).forEach(function(grp){var ks=grp.keys||[],si=-1;["shotsTotal","shotsOnGoal","shots","totalShots"].forEach(function(k){if(si<0)si=ks.indexOf(k)});
      if(si<0){var lb=grp.labels||[];["S","SOG"].forEach(function(k){if(si<0)si=lb.indexOf(k)})}
      if(si<0||ks.indexOf("goals")<0)return; // skaters only: the goalie group has no goals column
      (grp.athletes||[]).forEach(function(a){var n=+((a.stats||[])[si]);if(isNaN(n))return;var k=normName((a.athlete||{}).displayName),hit=null;
        (IX.names[k]||[]).forEach(function(p){if(ppos(p)!=="G"&&(!hit||(IX.P[p]&&IX.P[p].team===t)))hit=p});
        if(hit)out[hit]=n})})});return out}
function liveBox(doc,t){ // goals by player id for one team, from ESPN's box score (shootout goals are a separate column and are left out)
  var out={};((doc.boxscore||{}).players||[]).forEach(function(tm){if(eab((tm.team||{}).abbreviation)!==t)return;
    (tm.statistics||[]).forEach(function(grp){var gi=(grp.keys||[]).indexOf("goals");if(gi<0)return;
      (grp.athletes||[]).forEach(function(a){var n=+((a.stats||[])[gi])||0;if(!n)return;var k=normName((a.athlete||{}).displayName),hit=null;
        (IX.names[k]||[]).forEach(function(p){if(ppos(p)!=="G"&&(!hit||(IX.P[p]&&IX.P[p].team===t)))hit=p});
        if(hit)out[hit]=n})})});return out}
function livePlays(doc,m){ // ESPN's scoring plays as goal events; anything unexpected gives an empty list and the feed falls back to counts
  try{var tid={},ath={};(((doc.header||{}).competitions||[])[0]||{competitors:[]}).competitors.forEach(function(c){tid[(c.team||{}).id]=eab((c.team||{}).abbreviation)});
    ((doc.boxscore||{}).players||[]).forEach(function(tm){var t=eab((tm.team||{}).abbreviation);tid[(tm.team||{}).id]=t;(tm.statistics||[]).forEach(function(g){(g.athletes||[]).forEach(function(a){var x=a.athlete||{};ath[x.id]=[x.displayName,t]})})});
    var out=[];(doc.plays||[]).forEach(function(p){if(!p.scoringPlay)return;var ty=String((p.type||{}).text||""),per=+((p.period||{}).number)||0;
      if(/shootout/i.test(ty+" "+(p.text||""))||((p.period||{}).type||"")==="shootout"||(per>4&&m.gid&&String(m.gid).slice(4,6)!=="03"))return;
      var ps=p.participants||[],sc=ps.filter(function(x){return /scor/i.test(x.type||"")})[0]||ps[0];if(!sc)return;
      var id=(sc.athlete||{}).id,info=ath[id]||[(sc.athlete||{}).displayName,tid[(p.team||{}).id]];if(!info[0])return;
      var t=tid[(p.team||{}).id]||info[1],hit=null;(IX.names[normName(info[0])]||[]).forEach(function(q){if(ppos(q)!=="G"&&(!hit||(IX.P[q]&&IX.P[q].team===t)))hit=q});if(!hit)return;
      var st=String((p.strength||{}).text||ty),clk=String((p.clock||{}).displayValue||""),mm=clk.split(":"),inP=mm.length===2?(+mm[0])*60+(+mm[1]):0;
      out.push({p:hit,t:t,per:per,clk:(per>3?"OT":"P"+per)+(clk?" "+clk:""),sec:(Math.max(per,1)-1)*1200+inP,
        kind:/empty/i.test(st+(p.text||""))?3:/power/i.test(st)?1:/short/i.test(st)?2:0,
        a:ps.filter(function(x){return x!==sc&&/assist/i.test(x.type||"")}).map(function(x){return (ath[(x.athlete||{}).id]||[])[0]||(x.athlete||{}).displayName||""}).filter(Boolean),
        wall:p.wallclock?Date.parse(p.wallclock):null})});
    return out}catch(_){return []}}
function liveTick(){
  if(!D||document.hidden)return;var day=todayET(),ms=(D.sched||[]).filter(function(m){return m.d===day&&Date.parse(m.ts)<Date.now()+6e5});
  var yday=new Date(Date.now()-864e5*.5);ms=ms.concat((D.sched||[]).filter(function(m){return m.d<day&&!/FINAL/.test((LIVE[gameKey(m)]||{}).st||"")&&Date.parse(m.ts)>Date.now()-864e5*.4}));
  if(!ms.length)return;
  var dates={};ms.forEach(function(m){dates[m.d.replace(/-/g,"")]=1});
  Promise.all(Object.keys(dates).map(function(d){return fetch(ESPN+"scoreboard?dates="+d,{cache:"no-store"}).then(function(r){return r.json()})})).then(function(boards){
    var jobs=[];boards.forEach(function(b){(b.events||[]).forEach(function(e){var c=(e.competitions||[])[0]||{},st=((c.status||e.status||{}).type||{}).state,h=null,a=null,hs=0,as=0;
      (c.competitors||[]).forEach(function(x){var ab=eab((x.team||{}).abbreviation);if(x.homeAway==="home"){h=ab;hs=+x.score||0}else{a=ab;as=+x.score||0}});
      var m=ms.filter(function(x){return x.h===h&&x.a===a})[0];if(!m||(st!=="in"&&st!=="post"))return;
      var key=gameKey(m),L=LIVE[key];if(L&&L.st==="FINAL")return;
      jobs.push(fetch(ESPN+"summary?event="+e.id,{cache:"no-store"}).then(function(r){return r.json()}).then(function(doc){
        var gl=liveBox(doc,a),g2=liveBox(doc,h);Object.keys(g2).forEach(function(p){gl[p]=g2[p]});
        var sg=liveShots(doc,a),s2=liveShots(doc,h);Object.keys(s2).forEach(function(p){sg[p]=s2[p]});
        LIVE[key]={gl:gl,sc:[as,hs],st:st==="post"?"FINAL":"LIVE",ge:livePlays(doc,m),sg:Object.keys(sg).length?sg:null}}).catch(function(){}))})});
    return Promise.all(jobs)}).then(function(){
      var now=new Date(),hh=now.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});$("liveMsg").hidden=false;$("liveMsg").textContent="Live goals checked "+hh;
      var el=document.activeElement,typing=el&&/^(INPUT|SELECT)$/.test(el.tagName);
      if(applyLive()&&!typing&&["picks","slate","lineups","feed","shots","bets","scores"].indexOf(S.tab)>=0){var y=window.scrollY;render();window.scrollTo(0,y)}}).catch(function(){})}
if(/^https?:$/.test(location.protocol)){setInterval(liveTick,60000);setTimeout(liveTick,4000)}
if(typeof window!=="undefined"&&window.__GL_HOOK)window.__GL_HOOK({likelyOk:likelyOk,likelySelect:likelySelect,slate:slate,shotPrep:shotPrep,matchups:matchups,nbOver:nbOver,altOf:altOf,rungValues:rungValues,ladderOf:ladderOf,ladderGap:SG.ladder,liveShots:liveShots,shotCands:shotCands,shotSelect:shotSelect,shotPicks:shotPicks,pre:function(){return IX.PRE},livePlays:livePlays,goalEvents:goalEvents,npCap:npCap,todayET:todayET,S:S,C:C,data:function(){return D},ix:function(){return IX}}); // lets the build run the same model to lock the picks
var emb=$("goal-data"),inline=null;
try{if(emb&&emb.textContent.trim())inline=JSON.parse(emb.textContent)}catch(_){}
if(inline)start(inline);
else fetch("data.json").then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(start).catch(fail);
})();
