name: Refresh Goal Ledger

on:
  schedule:
    - cron: "7,37 * * * *"      # every half hour; GitHub may start a run some minutes late
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also load past 2026-27 prices (paid Odds API plans only; 10 requests per game)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # finished seasons are downloaded once and kept; the season in progress is fetched fresh
      - uses: actions/cache@v4
        with:
          path: nhl_cache
          key: nhl-cache-${{ steps.day.outputs.d }}
          restore-keys: nhl-cache-

      - name: Build data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Hours before puck drop at which each game is priced. One request per game per look.
          # "24,2" = a day ahead, then two hours out.  "6" = one look, about half the requests.
          ODDS_LOOKS: "24,2"
          ODDS_BACKFILL: ${{ inputs.backfill && '1' || '' }}
        run: python build_data.py --out data.json

      # work out tonight's picks with the page's own model and freeze them at the first puck drop
      - name: Lock picks
        run: node lock_picks.js index.html data.json picks.json

      # prices and injury flags already fetched are kept in the repository so they are never paid for twice
      - name: Save prices
        run: |
          git config user.name "goal-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in odds.json flags.json picks.json; do [ -f "$f" ] && git add -f "$f"; done
          if ! git diff --cached --quiet; then
            git commit -m "prices and picks $(date -u +%FT%H:%MZ) [skip ci]"
            # someone may have committed while this run was building: replay on top of theirs, and try again if needed
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi

      - run: mkdir -p site && cp index.html data.json site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
